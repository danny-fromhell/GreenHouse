<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Green House</title>

  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./assets/icons/site.webmanifest">

  <link rel="icon" type="image/png" href="./favicon-96x96.png">

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="brand">
        <img src="assets/img/logo.png" alt="Logo Green House" class="logo">
        <span>Green House</span>
      </a>

      <button class="menu-button" id="menuButton">☰</button>

      <div class="nav-menu" id="navMenu">
        <a href="index.html" class="active">Inicio</a>
        <a href="plants.html">Plantas</a>
        <a href="login.html">Dashboard</a>
        <button class="theme-toggle" id="themeToggle">☾</button>
      </div>
    </nav>
  </header>

  <main class="login-section">
    <form class="login-card" id="loginForm">
      <h1>Admin Login</h1>
      <p class="muted">Accede al panel de administración.</p>

      <div id="loginMessage"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@greenhouse.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="12345678" required>
      </div>

      <button class="btn-primary" type="submit">Iniciar sesión</button>

      <p class="muted">Demo: admin@greenhouse.com / 12345678</p>
    </form>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
